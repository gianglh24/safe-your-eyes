[workspace]
resolver = "3"
members = [
    "crates/sye-core",
    "crates/sye-platform",
    "crates/sye-ui",
    "crates/sye-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-2.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sye-core = { path = "crates/sye-core" }
sye-platform = { path = "crates/sye-platform" }
sye-ui = { path = "crates/sye-ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
